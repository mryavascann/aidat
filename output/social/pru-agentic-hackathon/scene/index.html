<script>
'use strict';
// ---------------------------------------------------------------------------
// Timeline (seconds). Keep in sync with ../audio/soundtrack.py
// S1 door 0–3.6 · S2 title 3.6–7.6 · S3 partner 7.6–11.2 · S4 logo 11.2–14.6
// S5 one day 14.6–17.8 · S6 date 17.8–20.6 · S7 lockup 20.6–25.0
// ---------------------------------------------------------------------------
const DURATION = 25.0;
const W = innerWidth, H = innerHeight, V = H > W, A = W / H;
const S = V ? W / 1080 : W / 1920;
document.documentElement.style.fontSize = (10 * S) + 'px';
document.body.classList.add(V ? 'v' : 'h');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ss = (t, a, b) => { const x = lin(t, a, b); return x * x * (3 - 2 * x); };
const mix = (a, b, x) => a + (b - a) * x;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pulse = (t, t0, k) => t < t0 ? 0 : Math.exp(-(t - t0) * k);

// ---------------------------------------------------------------- fonts
const LATIN = 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD';
const LATIN_EXT = 'U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF';
const F = '../assets/fonts/';
const faces = [];
for (const w of [500, 600, 700, 800, 900]) {
  faces.push(new FontFace('IT', `url(${F}inter-tight-latin-${w}-normal.woff2)`, { weight: String(w), unicodeRange: LATIN }));
  faces.push(new FontFace('IT', `url(${F}inter-tight-latin-ext-${w}-normal.woff2)`, { weight: String(w), unicodeRange: LATIN_EXT }));
}
for (const w of [400, 500, 700]) faces.push(new FontFace('JB', `url(${F}jetbrains-mono-latin-${w}-normal.woff2)`, { weight: String(w) }));

// ---------------------------------------------------------------- DOM helpers
const world = document.getElementById('world');
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function bigLines(parent, lines, cls) {
  const wrap = el('div', 'big gr ' + (cls || ''), parent);
  const rows = lines.map(txt => {
    const r = el('div', 'ln', wrap);
    const spans = [];
    for (const c of txt) {
      // keep punctuation in its letter's span so kerning holds; give word gaps a fixed width
      if (/[.,!]/.test(c) && spans.length) { spans[spans.length - 1].textContent += c; continue; }
      const s = el('span', c === ' ' ? 'ch sp' : 'ch', r); s.textContent = c === ' ' ? ' ' : c; spans.push(s);
    }
    return { el: r, spans };
  });
  return { wrap, rows, all: rows.flatMap(r => r.spans) };
}
function mono(parent, cls, txt) { const e = el('div', 'mono ' + cls, parent); e.dataset.txt = txt; e.textContent = ''; return e; }
const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>';
function decode(e, t, t0, cps) {
  const s = e.dataset.txt, k = (t - t0) * cps, f = Math.floor(t * 30);
  if (k >= s.length + 1) { if (e.textContent !== s) e.textContent = s; return; }
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === ' ') out += ' ';
    else if (i < k - 1) out += c;
    else if (i < k + 5 && k > 0) out += GLYPHS[Math.floor(rnd(f * 7.13 + i * 3.7) * GLYPHS.length)];
    else out += ' ';
  }
  e.textContent = out;
}
// per-letter reveal: rise + unblur
function reveal(spans, t, t0, stagger, dur, dy = .38, blur = 16) {
  spans.forEach((s, i) => {
    const x = eOutCubic(lin(t, t0 + i * stagger, t0 + i * stagger + dur));
    s.style.opacity = x;
    s.style.transform = x < 1 ? `translateY(${(1 - x) * dy}em)` : 'none';
    s.style.filter = x < .995 ? `blur(${((1 - x) * blur * S).toFixed(2)}px)` : 'none';
  });
}
// continuous shine across a row of per-letter gradient spans
function shineSetup(big) {
  big.rows.forEach(r => {
    const w = r.el.offsetWidth, x0 = r.el.offsetLeft;
    r.spans.forEach(s => { s._x = s.offsetLeft - x0; s._w = w; s.style.backgroundSize = `${3 * w}px 100%, ${w}px 100%`; });
  });
}
function shine(big, p) { // p: 0..1 sweep position
  big.rows.forEach(r => r.spans.forEach(s => {
    const c = mix(-.35, 1.35, p) * s._w - 1.5 * s._w;
    s.style.backgroundPosition = `${(c - s._x).toFixed(1)}px 0, ${(-s._x).toFixed(1)}px 0`;
  }));
}
function setL(e, o, tr, filt) {
  e.style.opacity = o;
  e.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  if (tr !== undefined) e.style.transform = tr;
  if (filt !== undefined) e.style.filter = filt;
}

// ---------------------------------------------------------------- PRU logo (disc + glowing lines)
async function prepLogo() {
  const img = new Image();
  img.src = '../assets/pru-logo.jpg';
  await img.decode();
  const N = 1200, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, N, N);
  const src = g.getImageData(0, 0, N, N);
  const disc = g.createImageData(N, N), lines = g.createImageData(N, N);
  const R = N * .4885, cx = N / 2, cy = N / 2;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y * N + x) * 4, r = Math.hypot(x + .5 - cx, y + .5 - cy);
    const inside = clamp((R - r) / 1.5);
    const R0 = src.data[i], G0 = src.data[i + 1], B0 = src.data[i + 2];
    disc.data[i] = R0; disc.data[i + 1] = G0; disc.data[i + 2] = B0; disc.data[i + 3] = 255 * inside;
    const lum = .3 * R0 + .59 * G0 + .11 * B0;
    let a = clamp((lum - 38) / 150); a = a * a * (3 - 2 * a);
    lines.data[i] = Math.min(255, R0 * 1.05 + 10); lines.data[i + 1] = Math.min(255, G0 * 1.0); lines.data[i + 2] = Math.min(255, B0 * 1.04 + 12);
    lines.data[i + 3] = 255 * a * inside;
  }
  const out = {};
  for (const [k, d] of [['disc', disc], ['lines', lines]]) { g.putImageData(d, 0, 0); out[k] = c.toDataURL('image/png'); }
  return out;
}
function logoEl(parent, urls) {
  const box = el('div', 'logo', parent);
  const d = el('img', 'disc', box); d.src = urls.disc;
  const l = el('img', 'lines', box); l.src = urls.lines;
  return { box, d, l };
}
const flick = (t, t0, t1) => { // neon power-on flicker 0..1
  if (t < t0) return 0; if (t >= t1) return 1;
  const p = lin(t, t0, t1), f = Math.floor(t * 30);
  return rnd(f * 3.3 + 11) < p * 1.25 ? mix(.55, 1, rnd(f * 1.7)) : rnd(f) * .12;
};

// ---------------------------------------------------------------- build scenes
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
const sc = {};
async function build() {
  const urls = await prepLogo();
  // S1
  sc.s1 = el('div', 'L', world); sc.s1.id = 's1';
  sc.s1a = mono(sc.s1, 'm1', 'PRU BLOCKCHAIN COMMUNITY');
  sc.s1b = mono(sc.s1, 'm2', 'IS JOINING');
  // S2
  sc.s2 = el('div', 'L', world); sc.s2.id = 's2';
  const blk = el('div', 'blk', sc.s2);
  sc.s2lock = el('div', 'lock', blk, '<img class="okx" src="../assets/okx-tr.svg"><span class="bar"></span><img class="t1" src="../assets/team1-turkiye.svg">');
  sc.s2t = bigLines(blk, ['Agentic', 'Hackathon']);
  // S3
  sc.s3 = el('div', 'L', world); sc.s3.id = 's3';
  sc.s3a = mono(sc.s3, 'm1', 'AS A');
  sc.s3t = bigLines(sc.s3, ['COMMUNITY', 'PARTNER']);
  // S4
  sc.s4 = el('div', 'L', world); sc.s4.id = 's4';
  sc.s4refl = el('div', 'refl', sc.s4);
  const rl = logoEl(sc.s4refl, urls); rl.box.style.width = rl.box.style.height = '100%';
  sc.s4logo = logoEl(sc.s4, urls);
  sc.s4a = mono(sc.s4, 'c1', 'PRU BLOCKCHAIN');
  sc.s4b = mono(sc.s4, 'c2', 'PIRI REIS UNIVERSITY');
  // S5
  sc.s5 = el('div', 'L', world); sc.s5.id = 's5';
  sc.s5a = bigLines(sc.s5, ['ONE DAY.'], 'a');
  sc.s5b = bigLines(sc.s5, V ? ['ONE WORKING', 'AI AGENT.'] : ['ONE WORKING AI AGENT.'], 'b');
  // S6
  sc.s6 = el('div', 'L', world); sc.s6.id = 's6';
  sc.s6a = mono(sc.s6, 'm1', 'SAVE THE DATE');
  sc.s6t = bigLines(sc.s6, ['OCTOBER 17']);
  sc.s6b = mono(sc.s6, 'm2', V ? 'ANKARA · THK & ORION TEKMER' : 'ANKARA — THK & ORION TEKMER');
  sc.s6c = mono(sc.s6, 'm3', '$3,000 PRIZE POOL');
  // S7
  sc.s7 = el('div', 'L', world); sc.s7.id = 's7';
  const inner = el('div', 'inner', sc.s7);
  inner.style.display = 'flex'; inner.style.flexDirection = 'column'; inner.style.alignItems = 'center';
  sc.s7top = mono(inner, 'top', V ? 'AGENTIC HACKATHON · 17.10 · ANKARA' : 'AGENTIC HACKATHON · 17.10.2026 · ANKARA');
  const row = el('div', 'row', inner);
  sc.s7logo = logoEl(row, urls);
  sc.s7x = el('div', 'x', row, '<i></i><i></i>');
  // the hackathon's own host lockup: OKX TR | team1 türkiye
  sc.s7t1 = el('div', 'hosts', row, '<img class="okx" src="../assets/okx-tr.svg"><span class="bar"></span><img class="t1" src="../assets/team1-turkiye.svg">');
  sc.s7pill = el('div', 'pill mono', inner); sc.s7pill.dataset.txt = 'COMMUNITY PARTNER'; sc.s7pill.textContent = 'COMMUNITY PARTNER';
  sc.s7url = el('div', 'url', sc.s7, V
    ? '<span>apply now</span><span class="u">agentichackathon.team1.network</span>'
    : `<span>apply now</span>${ARROW}<span class="u">agentichackathon.team1.network</span>`);

  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  [sc.s2t, sc.s3t, sc.s5a, sc.s5b, sc.s6t].forEach(shineSetup);
  // reflection placement for S4: mirror the logo about the floor horizon
  const lb = sc.s4logo.box.getBoundingClientRect();
  sc.s4logoCY = lb.top + lb.height / 2;
}

// ---------------------------------------------------------------- WebGL background
const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes; uniform float uTime;
uniform vec4 uCam, uDoor, uFlash, uHaze, uFloor, uFig0, uFig1, uFig2, uBeams, uRing, uTri, uOrb, uDust, uGlow2;
uniform vec3 uDoorCol, uHazeCol, uFloorCol, uOrbCol, uBeamColA, uBeamColB, uTriCol;

float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return s; }
float sdBox(vec2 p, vec2 b){ vec2 d=abs(p)-b; return length(max(d,0.))+min(max(d.x,d.y),0.); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float sdTri(vec2 p, float r){ const float k=1.7320508; p.x=abs(p.x)-r; p.y=p.y+r/k;
  if(p.x+k*p.y>0.) p=vec2(p.x-k*p.y,-k*p.x-p.y)/2.; p.x-=clamp(p.x,-2.*r,0.); return -length(p)*sign(p.y); }

float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float sdTrap(vec2 p, float r1, float r2, float he){
  vec2 k1=vec2(r2,he), k2=vec2(r2-r1,2.*he);
  p.x=abs(p.x);
  vec2 ca=vec2(p.x-min(p.x,(p.y<0.)?r1:r2), abs(p.y)-he);
  vec2 cb=p-k1+k2*clamp(dot(k1-p,k2)/dot(k2,k2),0.,1.);
  float s=(cb.x<0. && ca.y<0.)?-1.:1.;
  return s*sqrt(min(dot(ca,ca),dot(cb,cb)));
}

float figD(vec2 q){

    decode(sc.s6c, t, 19.15, 30); sc.s6c.style.opacity = ss(t, 19.1, 19.2);
    shine(sc.s6t, lin(t, 18.9, 20.1));
  }
  // S7
  {
    setL(sc.s7, t > 20.6 ? 1 : 0, `scale(${mix(1, 1.025, lin(t, 20.6, 25))})`);
    const li = eOutCubic(lin(t, 20.7, 21.4));
    sc.s7logo.box.style.opacity = li; sc.s7logo.box.style.transform = `scale(${mix(.82, 1, li)})`;
    sc.s7logo.box.style.filter = li < 1 ? `blur(${(1 - li) * 10 * S}px)` : 'none';
    sc.s7logo.l.style.opacity = flick(t, 20.75, 21.3);
    const xi = eOutExpo(lin(t, 21.0, 21.45));
    const xs = sc.s7x.children;
    xs[0].style.transform = `rotate(45deg) scaleX(${xi})`; xs[1].style.transform = `rotate(-45deg) scaleX(${xi})`;
    const wi = eOutExpo(lin(t, 21.15, 21.9));
    sc.s7t1.style.clipPath = `inset(-10% ${(1 - wi) * 100}% -10% 0)`;
    sc.s7t1.style.filter = wi < 1 ? `blur(${(1 - wi) * 6 * S}px)` : 'none';
    sc.s7t1.style.transform = `translateX(${(1 - wi) * -2}rem)`;
    decode(sc.s7top, t, 21.55, 34); sc.s7top.style.opacity = ss(t, 21.5, 21.6);
    const pi = eOutCubic(lin(t, 21.85, 22.3));
    sc.s7pill.style.opacity = pi; sc.s7pill.style.transform = `translateY(${(1 - pi) * 1.5}rem) scale(${mix(.94, 1, pi)})`;
    decode(sc.s7pill, t, 21.9, 30);
    const ui = eOutCubic(lin(t, 22.3, 22.8));
    sc.s7url.style.opacity = ui; sc.s7url.style.transform = `translateY(${(1 - ui) * 1.5}rem)`;
  }
  document.getElementById('fade').style.opacity = ss(t, 24.35, 25.0);
}

// ---------------------------------------------------------------- film grain
const grain = document.getElementById('grain');
const GW = Math.round(W / 3), GH = Math.round(H / 3);
grain.width = GW; grain.height = GH;
const gctx = grain.getContext('2d');
const tiles = [];
for (let k = 0; k < 8; k++) {
  const d = gctx.createImageData(GW, GH);
  let s = 1234567 + k * 7919;
  for (let i = 0; i < d.data.length; i += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const v = (s >> 8) & 255;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  tiles.push(d);
}

// ---------------------------------------------------------------- render entry
function renderAt(t) {
  const u = params(t);
  gl.viewport(0, 0, W, H);
  gl.uniform2f(U('uRes'), W, H); gl.uniform1f(U('uTime'), t);
  for (const [k, v] of Object.entries(u)) { const l = U(k); if (!l) continue; v.length === 4 ? gl.uniform4fv(l, v) : gl.uniform3fv(l, v); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
  const z = u.uCam[0];
  world.style.transform = `scale(${z}) translate(${-u.uCam[1] * H}px, ${u.uCam[2] * H}px)`;
  dom(t);
  gctx.putImageData(tiles[Math.floor(t * 30) % tiles.length], 0, 0);
}
window.DURATION = DURATION;
window.renderAt = renderAt;
window.ready = (async () => {
  await Promise.all(faces.map(f => f.load().then(ff => document.fonts.add(ff))));
  await build();
  renderAt(0);
  return true;
})();
</script>
